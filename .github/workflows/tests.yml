name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - uses: actions/setup-node@v4   # a few tests check the front-end scripts
        with:
          node-version: 20
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: node --check magpie/static/app.js && node --check magpie/static/i18n.js
      - run: python -m pytest -q
