services:
  magpie:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false   # settings can also be entered in the web UI (⚙)
    volumes:
      - ./data:/data

  # Optional HTTPS on your home network (needed for the iPhone app to work offline). In .env:
  #   COMPOSE_PROFILES=https   MAGPIE_LAN_HOST=192.168.1.20   (the server's LAN IP)
  # then open http://<that IP>/magpie-ca.crt on the phone and trust it. See README → "HTTPS at home".
  caddy:
    image: caddy:2-alpine
    profiles: ["https"]
    restart: unless-stopped
    depends_on:
      - magpie
    ports:
      - "${MAGPIE_HTTP_PORT:-80}:80"
      - "${MAGPIE_HTTPS_PORT:-443}:443"
    environment:
      - MAGPIE_LAN_HOST=${MAGPIE_LAN_HOST:-}
      - MAGPIE_HTTPS_PORT=${MAGPIE_HTTPS_PORT:-443}
    command: >-
      sh -c '[ -n "$$MAGPIE_LAN_HOST" ] || { echo "Set MAGPIE_LAN_HOST in .env to the server LAN IP (e.g. 192.168.1.20)"; exit 1; };
      exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/caddy:/data   # the private certificate authority; keep it, or phones must re-trust a new one

  # Optional on-prem LLM. Start with:  docker compose --profile local up -d
  # then pull a vision model:          docker compose exec ollama ollama pull qwen3-vl:8b
  # and set in .env:                   LOCAL_LLM_URL=http://ollama:11434/v1
  ollama:
    image: ollama/ollama:latest
    profiles: ["local"]
    restart: unless-stopped
    volumes:
      - ./data/ollama:/root/.ollama
    # NVIDIA GPU (needs the NVIDIA Container Toolkit); remove this block to run on CPU.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # Optional NVIDIA NIM (TensorRT-LLM/vLLM-optimized, NVIDIA GPUs only). Needs a free NGC API key:
  #   echo "$NGC_API_KEY" | docker login nvcr.io -u '$oauthtoken' --password-stdin
  #   docker compose --profile nim up -d
  # and in .env:  LOCAL_LLM_URL=http://nim:8000/v1   LOCAL_LLM_MODEL=<the model id the NIM serves>
  # Pick a vision NIM from https://build.nvidia.com (filter: vision) and set NIM_IMAGE to its container.
  nim:
    image: ${NIM_IMAGE:-nvcr.io/nim/meta/llama-3.2-11b-vision-instruct:latest}
    profiles: ["nim"]
    restart: unless-stopped
    environment:
      - NGC_API_KEY=${NGC_API_KEY}
    volumes:
      - ./data/nim-cache:/opt/nim/.cache
    shm_size: 16gb
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
