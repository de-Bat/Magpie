<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Magpie</title>
  <meta name="description" content="Save screenshots of recommendations; Magpie identifies them and looks up the details.">
  <link rel="manifest" href="/static/manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="64x64" href="/static/icons/favicon.png" media="(prefers-color-scheme: light)">
  <link rel="icon" type="image/png" sizes="32x32" href="/static/icons/favicon-32.png" media="(prefers-color-scheme: light)">
  <link rel="icon" type="image/png" sizes="64x64" href="/static/icons/favicon-dark.png" media="(prefers-color-scheme: dark)">
  <link rel="icon" type="image/png" sizes="32x32" href="/static/icons/favicon-32-dark.png" media="(prefers-color-scheme: dark)">
  <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Magpie">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#f6f5f2" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#151412" media="(prefers-color-scheme: dark)">
  <link rel="stylesheet" href="/static/style.css">
  <script>
    // Apply this device's theme choice before the first paint (Settings → Appearance). No choice = follow the device.
    try {
      const t = localStorage.getItem("magpie.theme");
      if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
    } catch {}
  </script>
</head>
<body>
  <header class="topbar">
    <div class="brand"><img class="logo-light" src="/static/icons/logo-96.png" alt="" width="32" height="32"><img class="logo-dark" src="/static/icons/logo-96-dark.png" alt="" width="32" height="32"><span>Magpie</span></div>
    <label class="search"><span aria-hidden="true">⌕</span><input id="search" type="search" placeholder="Search everything you saved" autocomplete="off" aria-label="Search"><kbd>/</kbd></label>
    <button id="debug-btn" class="pill-btn debug-btn" type="button" data-action="debug" title="Debug: what was sent to the AI models, and what came back" hidden>🐞<span class="debug-text"> Debug</span></button>
    <button id="limit-pill" class="pill-btn limit-pill" type="button" data-action="usage" hidden></button>
    <button id="cost-btn" class="pill-btn" type="button" data-action="usage" title="Usage &amp; cost" hidden></button>
    <button id="sync-status" class="sync-status" type="button" title="Sync status"></button>
    <button id="settings-btn" class="pill-btn settings-btn" type="button" data-action="settings" title="Settings" aria-label="Settings">⚙<span id="settings-dot" class="status-dot" hidden></span></button>
  </header>

  <nav id="tabs" class="tabs" role="tablist" aria-label="Type"></nav>

  <div class="subbar">
    <div class="seg" role="group" aria-label="Show">
      <button type="button" data-show="all" aria-pressed="true">All</button>
      <button type="button" data-show="check" aria-pressed="false" title="Items Magpie isn't sure about, that no source confirmed, or that failed"><span class="to">To </span>check <span id="check-count" class="count"></span></button>
    </div>
    <button id="tag-btn" class="pill-btn" type="button" aria-expanded="false" aria-controls="tag-pop" aria-label="Tags" title="Tags">#<span class="lbl"> Tags</span></button>
    <div id="active-filters" class="active-filters"></div>
    <span class="spacer"></span>
    <label class="cols-pick" id="cols-ctl" title="How many cards per row">
      <span class="cols-icon" aria-hidden="true">▥</span>
      <select id="cols-select" aria-label="Columns"></select>
    </label>
    <div class="seg" role="group" aria-label="Layout">
      <button type="button" data-layout="grid" aria-pressed="true" aria-label="Grid">▦</button>
      <button type="button" data-layout="list" aria-pressed="false" aria-label="List">☰</button>
    </div>
  </div>

  <div id="tag-pop" class="tag-pop" role="dialog" aria-label="Tags" hidden>
    <input id="tag-filter" type="search" placeholder="Filter tags" aria-label="Filter tags" autocomplete="off">
    <div id="tags" class="chips"></div>
    <p class="hint">Pick several to narrow down. You can also type <kbd>#tag</kbd> in the search box.</p>
  </div>

  <main class="content">
    <div id="banner" class="banner" hidden></div>
    <div id="grid" class="grid"></div>
    <p id="empty" class="empty" hidden>Nothing here yet.</p>
  </main>

  <button id="fab" class="fab" type="button" data-action="add"><span aria-hidden="true">＋</span> Add</button>
  <div id="dropveil" class="dropveil" hidden><div>Drop screenshots or a link to add them</div></div>

  <dialog id="add-dialog" class="sheet-dialog">
    <div class="sheet-head"><h2>Add to Magpie</h2><button class="btn close" type="button" data-action="close-add" aria-label="Close">✕</button></div>
    <div id="dropzone" class="dropzone">
      <label class="btn primary" for="file-input">Choose screenshots</label>
      <input id="file-input" type="file" accept="image/png,image/jpeg,image/webp,image/gif" multiple hidden>
      <span class="hint">Or paste (Ctrl/⌘+V) or drop them anywhere on the page.</span>
      <form id="link-form" class="link-form" autocomplete="off">
        <input id="link-input" type="text" inputmode="url" autocorrect="off" spellcheck="false" placeholder="Or paste a link: https://…" enterkeyhint="go" autocapitalize="off" aria-label="Link">
        <button class="btn" type="submit">Save link</button>
      </form>
      <input id="note" type="text" placeholder="Note for this one (optional), e.g. Dana recommended it" aria-label="Note">
    </div>
  </dialog>

  <dialog id="detail"></dialog>
  <div id="toast" class="toast" hidden></div>

  <script src="/static/app.js"></script>
</body>
</html>
